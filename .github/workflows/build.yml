name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZUP-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret: $v"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo "Release is only built when all four secrets are set."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode keystore (kept only in runner temp)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zup-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/zup-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature and manifest
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC" || { echo "::error::$SRC not found (APK not signed/built)"; ls -R app/build/outputs || true; exit 1; }
          cp "$SRC" ZUP-release.apk

          echo "== apksigner verify =="
          "$BT/apksigner" verify --verbose --print-certs ZUP-release.apk | tee verify.txt
          if grep -qi "Android Debug" verify.txt; then
            echo "::error::APK is signed with a debug certificate"; exit 1
          fi

          echo "== badging =="
          "$BT/aapt2" dump badging ZUP-release.apk > badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion" badging.txt
          if grep -q "application-debuggable" badging.txt; then
            echo "::error::APK is debuggable"; exit 1
          fi

          {
            echo "### ZUP-release.apk"
            echo '```'
            grep -E "^package:|^sdkVersion|^targetSdkVersion" badging.txt
            grep -E "Verified using|certificate SHA-256" verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUP-release-apk
          path: ZUP-release.apk
          if-no-files-found: error

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/zup-release.jks"

  install-test:
    name: Install test on emulator
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZUP-release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install ZUP-release.apk
            adb shell pm list packages | grep com.fortexer.zup
            adb shell monkey -p com.fortexer.zup -c android.intent.category.LAUNCHER 1

