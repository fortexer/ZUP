
name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUP-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          missing=0

          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret: $v"
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            echo "::error::Release cannot be built without all signing secrets."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/zup-release.jks"

          test -s "$RUNNER_TEMP/zup-release.jks"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/zup-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"

          SRC="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$SRC" ]; then
            echo "::error::Release APK was not found."
            ls -R app/build/outputs || true
            exit 1
          fi

          cp "$SRC" ZUP-release.apk

          echo "== Verify APK signature =="

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            ZUP-release.apk | tee verify.txt

          if grep -qi "Android Debug" verify.txt; then
            echo "::error::APK is signed with a debug certificate."
            exit 1
          fi

          echo "== Check APK manifest =="

          "$BT/aapt2" dump badging ZUP-release.apk > badging.txt

          grep -E "^package:|^sdkVersion|^targetSdkVersion" badging.txt

          if grep -q "application-debuggable" badging.txt; then
            echo "::error::Release APK is debuggable."
            exit 1
          fi

          {
            echo "### ZUP Release APK"
            echo '```'
            grep -E "^package:|^sdkVersion|^targetSdkVersion" badging.txt
            grep -E "Verified using|certificate SHA-256" verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZUP-release-apk
          path: ZUP-release.apk
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zup-release.jks"

  install-test:
    name: Install test on emulator
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: ZUP-release-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install ZUP-release.apk
            adb shell pm list packages | grep com.fortexer.zup
            adb shell monkey -p com.fortexer.zup \
              -c android.intent.category.LAUNCHER 1
